# ==============================================================================
# ARK GPU-less Integration Test Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
# Replaces vllm, tei-embed, and tei-rerank with lightweight Python mocks.
# ==============================================================================

services:
  vllm:
    image: python:3.12-slim-bookworm
    shm_size: 256mb
    volumes:
      - ./tests:/tests:ro
    command: ["python3", "/tests/mock_inference.py", "8000"]
    deploy: {}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  tei-embed:
    image: python:3.12-slim-bookworm
    volumes:
      - ./tests:/tests:ro
    command: ["python3", "/tests/mock_inference.py", "80"]
    deploy: {}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:80/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  tei-rerank:
    image: python:3.12-slim-bookworm
    volumes:
      - ./tests:/tests:ro
    command: ["python3", "/tests/mock_inference.py", "80"]
    deploy: {}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:80/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

name: ARK Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate (defaults to v<VERSION>)"
        required: false
  workflow_call:
    inputs:
      ref:
        description: "Git ref or tag to release"
        required: false
        type: string
      tag:
        description: "Release tag to validate and publish"
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve release version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${BASE_VERSION}" ]]; then
              echo "ERROR: Tag version (${TAG_VERSION}) does not match VERSION (${BASE_VERSION})."
              exit 1
            fi
            if ! grep -q "## \[${BASE_VERSION}\]" CHANGELOG.md; then
              echo "ERROR: CHANGELOG.md is missing section '## [${BASE_VERSION}]'."
              exit 1
            fi
            RELEASE_VERSION="${BASE_VERSION}"
            TAG_NAME="${GITHUB_REF_NAME}"
            IS_TAGGED="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_call" ]]; then
            TAG_VERSION="${INPUT_TAG#v}"
            if [[ -n "${TAG_VERSION}" && "${TAG_VERSION}" != "${BASE_VERSION}" ]]; then
              echo "ERROR: Tag version (${TAG_VERSION}) does not match VERSION (${BASE_VERSION})."
              exit 1
            fi
            if ! grep -q "## \[${BASE_VERSION}\]" CHANGELOG.md; then
              echo "ERROR: CHANGELOG.md is missing section '## [${BASE_VERSION}]'."
              exit 1
            fi
            RELEASE_VERSION="${BASE_VERSION}"
            TAG_NAME="v${RELEASE_VERSION}"
            IS_TAGGED="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            SHORT_SHA="$(git rev-parse --short HEAD)"
            STAMP="$(date -u +'%Y.%m.%Y%m%d%H%M%S')"
            RELEASE_VERSION="${STAMP}-${SHORT_SHA}"
            TAG_NAME="v${RELEASE_VERSION}"
            IS_TAGGED="false"
          else
            if [[ -n "${INPUT_TAG}" ]]; then
              TAG_VERSION="${INPUT_TAG#v}"
              if [[ "${TAG_VERSION}" != "${BASE_VERSION}" ]]; then
                echo "ERROR: Tag version (${TAG_VERSION}) does not match VERSION (${BASE_VERSION})."
                exit 1
              fi
            fi
            RELEASE_VERSION="${BASE_VERSION}"
            TAG_NAME="v${RELEASE_VERSION}"
            IS_TAGGED="false"
          fi

          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "is_tagged=${IS_TAGGED}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release version: ${RELEASE_VERSION} (tag: ${TAG_NAME}, tagged: ${IS_TAGGED})"

      - name: Shell syntax & unit tests
        run: |
          bash -n scripts/*.sh
          python3 -m unittest discover -s tests -v

      - name: Build ark-admin image with OCI metadata
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg "ARK_VERSION=${VERSION}" \
            --build-arg "ARK_GIT_COMMIT=${GIT_COMMIT}" \
            --build-arg "ARK_BUILD_DATE=${BUILD_DATE}" \
            -t "ark-admin:${VERSION}" ./admin
          docker image inspect --format '{{json .Config.Labels}}' "ark-admin:${VERSION}"

      - name: Package release archive and SHA-256 checksums
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          STAGE_DIR="dist/ark-${VERSION}"
          mkdir -p dist "${STAGE_DIR}"
          cp -a \
            VERSION LICENSE NOTICE CHANGELOG.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
            README.md AGENTS.md .env.example docker-compose.yml docker-compose.llm.yml docker-compose.test.yml \
            admin llm-admin config docs provisioning scripts tests \
            "${STAGE_DIR}/"
          printf '%s\n' "${VERSION}" > "${STAGE_DIR}/VERSION"
          python3 - "${STAGE_DIR}/README.md" "${VERSION}" <<'PYEOF'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          ver = sys.argv[2]
          text = p.read_text(encoding="utf-8")
          updated, n = re.subn(r'^(\*\*Version:\*\* )`[^`]+`', rf'\g<1>`{ver}`', text, count=1, flags=re.M)
          if n != 1:
              raise RuntimeError("Failed to update **Version:** in staged README.md")
          p.write_text(updated, encoding="utf-8")
          PYEOF
          find "${STAGE_DIR}" -name '__pycache__' -type d -prune -exec rm -rf {} +
          tar -C dist -czf "dist/ark-${VERSION}.tar.gz" "ark-${VERSION}"
          (cd dist && sha256sum "ark-${VERSION}.tar.gz" > "ark-${VERSION}.tar.gz.sha256")

          python3 - "dist/ark-${VERSION}-manifest.json" "${VERSION}" "$(git rev-parse HEAD)" <<'PYEOF'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          out = {
              "product": "ARK (Air-gapped Retrieval & Knowledge)",
              "version": sys.argv[2],
              "scheme": "CalVer",
              "license": "Apache-2.0",
              "git_commit": sys.argv[3],
              "released_at": datetime.now(timezone.utc).isoformat(),
              "archive": f"ark-{sys.argv[2]}.tar.gz",
          }
          Path(sys.argv[1]).write_text(json.dumps(out, indent=2) + "\n", encoding="utf-8")
          PYEOF
          (cd dist && sha256sum "ark-${VERSION}-manifest.json" >> "SHA256SUMS" && sha256sum "ark-${VERSION}.tar.gz" >> "SHA256SUMS")

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          GIT_COMMIT="$(git rev-parse --short HEAD)"
          python3 - "${VERSION}" "${GIT_COMMIT}" <<'PYEOF' > dist/RELEASE_NOTES.md
          import re, sys
          from pathlib import Path

          ver, commit = sys.argv[1], sys.argv[2]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, flags=re.M | re.S)
          if m:
              print(m.group(1).strip())
          else:
              print(f"Automated release `v{ver}` from commit `{commit}`.")
          PYEOF

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_call'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          prerelease: ${{ steps.meta.outputs.is_tagged != 'true' }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/ark-*.tar.gz
            dist/ark-*.tar.gz.sha256
            dist/ark-*-manifest.json
            dist/SHA256SUMS

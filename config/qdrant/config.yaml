log_level: INFO

# Strict air-gap compliance: disable all anonymous telemetry
telemetry_disabled: true

storage:
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/snapshots

  # Store payloads on disk to preserve RAM for HNSW vector indices under multi-tenant load
  on_disk_payload: true

  performance:
    max_search_threads: 0
    max_optimization_threads: 2

  optimizers:
    deleted_threshold: 0.2
    vacuum_min_vector_number: 1000
    default_segment_number: 0
    max_segment_size_kb: 200000
    memmap_threshold_kb: 50000
    indexing_threshold_kb: 20000
    flush_interval_sec: 5
    max_optimization_threads: 2

  hnsw_index:
    m: 16
    ef_construct: 100
    full_scan_threshold_kb: 10000
    max_indexing_threads: 0
    on_disk: false

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  max_request_size_mb: 128
  max_workers: 0
  enable_cors: false

cluster:
  enabled: false
